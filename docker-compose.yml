version: '3.8'

services:
  face_recognition:
    build: ./face/src/
    container_name: faceindex
    ports:
      - "8000:8000"  
    environment:
      - REDIS_HOST=10.99.0.55
      - REDIS_PORT=6379
      - REDIS_USERNAME=default
      - REDIS_PASSWORD=RSUD_StrongPassword
      - PATH_FILE=/app/connection/temp
    volumes:
      # - ./faceApi/data:/app/connection/data
      - type: volume
        source: smb_volume2
        target: /app/connection/data
      # - ./faceApi/received_frames:/app/connection/temp
      - type: volume
        source: smb_volume
        target: /app/connection/temp
    networks:
      - api-cluster
volumes:
  smb_volume:
    driver: local
    driver_opts:
      type: cifs
      o: username=${SMB_USER},password=${SMB_PASS},domain=${SMB_DOMAIN},rw
      device: //10.20.0.28/Fakhry/Backup/deep/temp
  smb_volume2:
    driver: local
    driver_opts:
      type: cifs
      o: username=${SMB_USER},password=${SMB_PASS},domain=${SMB_DOMAIN},rw
      device: //10.20.0.28/Fakhry/Backup/deep/data
