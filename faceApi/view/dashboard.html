<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Feather Icons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
    <style>
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">
    <!-- Header -->
    <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div class="p-2.5 bg-indigo-600 rounded-xl shadow-lg shadow-indigo-200">
                        <i data-feather="users" class="w-6 h-6 text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-slate-900 tracking-tight">Face Recognition</h1>
                        <p class="text-sm text-slate-500 font-medium">Dashboard Sistem Pengenalan Wajah</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <span class="inline-flex items-center bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full text-sm font-semibold border border-emerald-200 shadow-sm">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></span>
                        Sistem Aktif
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Search Section -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8 transition-all hover:shadow-md">
            <div class="flex items-center mb-4">
                <i data-feather="search" class="w-5 h-5 text-slate-400 mr-2"></i>
                <h2 class="text-lg font-semibold text-slate-800">Cari Pengguna</h2>
            </div>
            <form id="searchForm" class="space-y-4 md:space-y-0 md:flex md:items-end md:space-x-4">
                <div class="flex-1">
                    <label for="username" class="block text-sm font-medium text-slate-600 mb-1">Username</label>
                    <input type="text" name="username" id="username" placeholder="Masukkan username..." class="block w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white transition-colors" />
                </div>
                <div class="flex-1">
                    <label for="name" class="block text-sm font-medium text-slate-600 mb-1">Nama Lengkap</label>
                    <input type="text" name="name" id="name" placeholder="Masukkan nama..." class="block w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white transition-colors" />
                </div>
                <div class="flex-1">
                    <label for="nik" class="block text-sm font-medium text-slate-600 mb-1">NIK</label>
                    <input type="text" name="nik" id="nik" placeholder="Masukkan NIK..." class="block w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:bg-white transition-colors" />
                </div>
                <div class="w-full md:w-auto pt-4 md:pt-0">
                    <button type="submit" id="searchBtn" class="w-full md:w-auto inline-flex items-center justify-center px-6 py-2.5 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                        <i data-feather="filter" class="w-4 h-4 mr-2"></i> Terapkan
                    </button>
                </div>
            </form>
        </div>

        <!-- Statistics Section -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Stat Card 1 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center space-x-4">
                <div class="p-4 bg-blue-50 rounded-xl">
                    <i data-feather="users" class="w-8 h-8 text-blue-600"></i>
                </div>
                <div>
                    <p class="text-sm font-medium text-slate-500">Total Pengguna</p>
                    <p class="text-3xl font-bold text-slate-900" id="totalUsers">-</p>
                </div>
            </div>
            
            <!-- Stat Card 2 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center space-x-4">
                <div class="p-4 bg-emerald-50 rounded-xl">
                    <i data-feather="image" class="w-8 h-8 text-emerald-600"></i>
                </div>
                <div>
                    <p class="text-sm font-medium text-slate-500">Total Gambar Terdata</p>
                    <p class="text-3xl font-bold text-slate-900" id="totalImages">-</p>
                </div>
            </div>
            
            <!-- Stat Card 3 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center space-x-4">
                <div class="p-4 bg-purple-50 rounded-xl">
                    <i data-feather="maximize" class="w-8 h-8 text-purple-600"></i>
                </div>
                <div>
                    <p class="text-sm font-medium text-slate-500">Wajah Terdeteksi</p>
                    <p class="text-3xl font-bold text-slate-900" id="totalFaces">-</p>
                </div>
            </div>
        </div>

        <!-- Loader -->
        <div id="loader" class="hidden flex justify-center items-center py-12">
            <svg class="animate-spin h-8 w-8 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="ml-3 text-slate-500 font-medium">Memuat data...</span>
        </div>

        <!-- User Cards Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6" id="userCards">
            <!-- User cards will be dynamically injected here -->
        </div>
        
        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16 bg-white rounded-2xl border border-slate-200 shadow-sm">
            <div class="mx-auto w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4">
                <i data-feather="inbox" class="w-8 h-8 text-slate-400"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-900">Tidak ada data ditemukan</h3>
            <p class="text-slate-500 mt-1">Coba sesuaikan filter pencarian Anda.</p>
        </div>
    </main>

    <script>
        // Inisialisasi Feather Icons
        feather.replace();

        // Variable global untuk menyimpan controller fetch saat ini
        let currentAbortController = null;

        // Utilitas Format NIK
        function formatNIK(nik) {
            if(!nik) return "-";
            return nik.replace(/(\d{4})(\d{4})(\d{4})(\d{4})/, '$1-$2-$3-$4');
        }

        // SVG Fallback untuk Gambar yang Gagal Dimuat
        const fallbackImageBase64 = "data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgdmlld0JveD0iMCAwIDEwMCAxMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiBmaWxsPSIjRjNGNEY2Ii8+CjxwYXRoIGQ9Ik0zNSA0MEMzNSAzNi42ODYzIDM3LjY4NjMgMzQgNDEgMzRINTlDNjIuMzEzNyAzNCA2NSAzNi42ODYzIDY1IDQwVjQ2QzY1IDQ5LjMxMzcgNjIuMzEzNyA1MiA1OSA1Mkg0MUMzNy42ODYzIDUyIDM1IDQ5LjMxMzcgMzUgNDZWNDBaIiBmaWxsPSIjOUNBM0FGIi8+CjxwYXRoIGQ9Ik00MCA2MEg2MEw1NS42IDY4SDQ0LjRMNDAgNjBaIiBmaWxsPSIjOUNBM0FGIi8+Cjwvc3ZnPgo=";

        // Fungsi Debounce untuk menghindari terlalu banyak request saat mengetik
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // Fungsi Trigger Pencarian Utama
        function triggerSearch() {
            const username = document.getElementById('username').value.trim();
            const name = document.getElementById('name').value.trim();
            const nik = document.getElementById('nik').value.trim();
            
            const params = new URLSearchParams();
            if (username) params.append('username', username);
            if (name) params.append('name', name);
            if (nik) params.append('nik', nik);
            
            fetchUsersData(params.toString());
        }

        // Buat versi debounced dari triggerSearch (waktu tunggu 500ms)
        const debouncedSearch = debounce(triggerSearch, 500);

        // Tambahkan event listener pada setiap input agar langsung memuat data saat diketik
        document.getElementById('username').addEventListener('input', debouncedSearch);
        document.getElementById('name').addEventListener('input', debouncedSearch);
        document.getElementById('nik').addEventListener('input', debouncedSearch);

        // Form Submit Event Handler (Mencegah reload & eksekusi instan tanpa debounce jika dienter)
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            triggerSearch(); 
        });

        // Fetch Data Function
        async function fetchUsersData(queryString = "") {
            const userCardsContainer = document.getElementById('userCards');
            const loader = document.getElementById('loader');
            const emptyState = document.getElementById('emptyState');
            
            // Batalkan request sebelumnya jika masih berjalan
            if (currentAbortController) {
                currentAbortController.abort();
            }
            // Buat AbortController baru untuk request saat ini
            currentAbortController = new AbortController();

            // Set Loading UI
            userCardsContainer.innerHTML = '';
            loader.classList.remove('hidden');
            emptyState.classList.add('hidden');

            const url = queryString ? `/api/users?${queryString}` : '/api/users';
            
            try {
                // Sertakan sinyal abort ke dalam fetch
                const response = await fetch(url, { signal: currentAbortController.signal });
                
                // MOCK UP DATA TANGKAPAN JIKA API GAGAL AGAR PREVIEW TETAP BERJALAN
                let data = null;
                if (!response.ok) {
                    throw new Error("Simulated fallback needed");
                } else {
                    data = await response.json();
                }

                renderDashboard(data);
                
            } catch (error) {
                // Abaikan error jika itu adalah hasil dari pembatalan (abort)
                if (error.name === 'AbortError') {
                    console.log('Fetch sebelumnya dibatalkan karena ada request baru.');
                    return; // Jangan lanjutkan ke mock data atau render
                }

                console.warn('Menggunakan data sampel karena API tidak tersedia.');
                // MOCK DATA: Digunakan hanya sebagai fallback ketika API error
                // Simulasi memfilter berdasarkan input yang diketik agar preview lebih interaktif
                const searchParams = new URLSearchParams(queryString);
                const queryName = searchParams.get('name') ? searchParams.get('name').toLowerCase() : '';
                
                const mockData = {
                    record: 1,
                    totalFaces: 2,
                    data: [
                        {
                            username: "johndoe99",
                            name: "John Doe",
                            nik: "3201012304950001",
                            faces: [
                                { _id: "64a1b2c3d4e5", file: "https://i.pravatar.cc/150?u=1", images: { url: "https://example.com/images/scan-001.jpg" } },
                                { _id: "64a1b2c3d4e6", file: "https://i.pravatar.cc/150?u=2", images: { url: "https://example.com/images/scan-002.jpg" } }
                            ]
                        }
                    ]
                };

                // Filter Dummy Data jika filter ada nilainya
                if(queryName && !mockData.data[0].name.toLowerCase().includes(queryName)){
                    mockData.data = [];
                    mockData.record = 0;
                    mockData.totalFaces = 0;
                }

                renderDashboard(mockData);
            }
        }

        // Render Dashboard UI
        function renderDashboard(apiData) {
            const loader = document.getElementById('loader');
            const emptyState = document.getElementById('emptyState');
            const userCardsContainer = document.getElementById('userCards');
            
            // Sembunyikan loader
            loader.classList.add('hidden');

            if (!apiData || !apiData.data || apiData.data.length === 0) {
                emptyState.classList.remove('hidden');
                document.getElementById('totalUsers').textContent = "0";
                document.getElementById('totalImages').textContent = "0";
                document.getElementById('totalFaces').textContent = "0";
                return;
            }

            // Update stats
            document.getElementById('totalUsers').textContent = apiData.record || apiData.data.length;
            document.getElementById('totalFaces').textContent = apiData.totalFaces || 0;
            
            let totalImages = 0;

            // Generate HTML Cards
            apiData.data.forEach(user => {
                // Filter hanya yang punya data wajah
                if (user.faces && user.faces.length > 0) {
                    
                    // Hitung jumlah gambar
                    totalImages += user.faces.length;
                    
                    const userCard = document.createElement('div');
                    userCard.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-lg transition-all duration-300';
                    
                    const primaryImage = user.faces[0].file || fallbackImageBase64;
                    
                    // Render isi card
                    userCard.innerHTML = `
                        <div class="p-6 border-b border-slate-100 bg-slate-50/50">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                <div class="flex items-center space-x-4">
                                    <div class="relative flex-shrink-0">
                                        <img loading="lazy" src="${primaryImage}" 
                                             onerror="this.src='${fallbackImageBase64}'"
                                             class="w-16 h-16 rounded-full object-cover border-2 border-white shadow-md" alt="${user.name}">
                                        <div class="absolute bottom-0 right-0 w-4 h-4 bg-emerald-400 border-2 border-white rounded-full" title="Active"></div>
                                    </div>
                                    <div>
                                        <h3 class="text-xl font-bold text-slate-900">${user.name}</h3>
                                        <div class="flex items-center text-sm text-slate-500 mt-1">
                                            <span class="font-mono bg-slate-100 px-2 py-0.5 rounded mr-2 text-xs">${formatNIK(user.nik)}</span>
                                            <span>@${user.username || 'user'}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="sm:text-right flex-shrink-0">
                                    <span class="inline-flex items-center bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full text-sm font-semibold ring-1 ring-inset ring-indigo-600/10">
                                        <i data-feather="camera" class="w-4 h-4 mr-1.5"></i>
                                        ${user.faces.length} Wajah
                                    </span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="p-6 bg-white">
                            <h4 class="text-xs font-bold text-slate-400 mb-4 uppercase tracking-wider">Detail Pengenalan Gambar</h4>
                            <div class="space-y-3">
                                ${user.faces.map(face => `
                                    <div class="group bg-slate-50 rounded-xl p-4 border border-slate-100 relative transition-colors hover:bg-slate-100" id="face-${face._id}">
                                        
                                        <button onclick="deleteImage('face-${face._id}')" 
                                                class="absolute top-4 right-4 bg-white hover:bg-red-50 text-slate-400 hover:text-red-500 rounded-full w-8 h-8 flex items-center justify-center transition-colors shadow-sm border border-slate-200 opacity-0 group-hover:opacity-100 focus:opacity-100" title="Hapus Gambar">
                                            <i data-feather="trash-2" class="w-4 h-4"></i>
                                        </button>
                                        
                                        <div class="flex items-start space-x-4">
                                            <div class="flex-shrink-0">
                                                <div class="w-16 h-16 bg-slate-200 rounded-lg overflow-hidden border border-slate-200">
                                                    <img src="${face.file}" alt="Wajah" loading="lazy" class="w-full h-full object-cover" onerror="this.src='${fallbackImageBase64}'">
                                                </div>
                                            </div>
                                            
                                            <div class="flex-1 min-w-0 pr-8">
                                                <p class="text-xs text-slate-500 mb-0.5 font-medium">ID Pengenalan</p>
                                                <p class="text-sm font-mono text-slate-900 mb-2 truncate">${face._id}</p>
                                                
                                                <p class="text-xs text-slate-500 mb-0.5 font-medium">URL Sumber</p>
                                                <a href="${face.images?.url || '#'}" target="_blank" class="text-xs text-indigo-600 hover:text-indigo-800 bg-indigo-50/50 hover:bg-indigo-50 px-2 py-1 rounded inline-block truncate max-w-full transition-colors border border-indigo-100/50" title="${face.images?.url || 'URL tidak tersedia'}">
                                                    ${(face.images?.url || '').length > 40 ? (face.images?.url || '').slice(0, 40) + '...' : (face.images?.url || 'Tidak tersedia')}
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    userCardsContainer.appendChild(userCard);
                }
            });

            // Update Total Gambar
            document.getElementById('totalImages').textContent = totalImages;

            // Re-initialize feather icons untuk card yang baru dirender
            feather.replace();
        }

        // Fungsi Menghapus Gambar
        async function deleteImage(domId) {
            const dbId = domId.replace('face-', ''); // Ekstrak ID asli
            
            // Animasi konfirmasi & hapus elemen secara lokal terlebih dahulu untuk UX yang lebih baik
            const el = document.getElementById(domId);
            if(el) {
                if(!confirm('Apakah Anda yakin ingin menghapus data wajah ini?')) return;
                
                el.style.opacity = '0.5';
                el.style.pointerEvents = 'none';
                
                try {
                    // Eksekusi API Hapus
                    const response = await fetch('/api/user/face', {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ id: dbId })
                    });
                    
                    // Asumsi request berhasil (Disesuaikan dengan logika response server)
                    el.style.transition = 'all 0.3s ease';
                    el.style.transform = 'scale(0.95)';
                    el.style.opacity = '0';
                    
                    setTimeout(() => {
                        el.remove();
                        // Kurangi counter secara lokal jika perlu
                        const imagesCount = document.getElementById('totalImages');
                        imagesCount.textContent = Math.max(0, parseInt(imagesCount.textContent) - 1);
                    }, 300);

                } catch (error) {
                    alert('Gagal menghapus gambar. Silakan coba lagi.');
                    el.style.opacity = '1';
                    el.style.pointerEvents = 'auto';
                }
            }
        }

        // Jalankan Fetch Data saat halaman pertama kali dimuat
        document.addEventListener('DOMContentLoaded', function() {
            // fetchUsersData();
        });
    </script>
</body>
</html>
